name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-tests:
    name: Python tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # NOTE: `pip install -e .` currently fails (maturin can't find a
      # buildable Cargo package at the pyproject.toml root — see
      # ROADMAP_HONEST.md). Until that's fixed, install runtime + dev
      # dependencies directly and run the pure-Python package via
      # PYTHONPATH, which is how this test suite was actually verified.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install click pydantic pyyaml sqlglot networkx \
                      snowflake-connector-python google-cloud-bigquery \
                      pandas pyarrow tqdm tomli \
                      pytest pytest-cov pytest-xdist

      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest tests/ -v

  rust-tests:
    name: Rust core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # NOTE: `cargo build`/`cargo test` at the workspace root fail to link
      # because bindings/python is a PyO3 extension-module cdylib, which
      # cargo cannot link directly (requires maturin). Scope to the core
      # library crate, which has no such constraint.
      - name: cargo fmt check
        run: cargo fmt -p pydbtguard-core -- --check

      # dead_code is allowed here deliberately: two fields
      # (FailurePredictor::lookback_days, HistoricalReplayEngine::options)
      # are genuinely unused today and tracked as disclosed tech debt in
      # ROADMAP_HONEST.md rather than silently suppressed everywhere.
      - name: cargo clippy
        run: cargo clippy -p pydbtguard-core --all-targets -- -D warnings -A dead-code

      - name: cargo test
        run: cargo test -p pydbtguard-core

  security-audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install project dependencies for audit
        run: |
          python -m pip install --upgrade pip pip-audit
          pip install click pydantic pyyaml sqlglot networkx \
                      snowflake-connector-python google-cloud-bigquery \
                      pandas pyarrow tqdm tomli

      - name: pip-audit (Python dependencies)
        run: pip-audit
        continue-on-error: true

      - name: cargo audit (Rust dependencies)
        run: |
          cargo install cargo-audit --locked
          cargo audit
        continue-on-error: true
