name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  python-tests:
    name: Python tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # Builds the PyO3 extension via the maturin backend and installs the
      # package, then runs the same test-suite used locally.
      - name: Build and install
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Run tests
        run: pytest -v

  rust-tests:
    name: Rust core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt check
        run: cargo fmt --all -- --check

      # Scope clippy/test to the core crate: `bindings/python` is a PyO3
      # extension-module cdylib, which cargo cannot link outside maturin.
      - name: cargo clippy
        run: cargo clippy -p pydbtguard-core --all-targets -- -D warnings

      - name: cargo test
        run: cargo test -p pydbtguard-core

  security-audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: pip-audit (Python dependencies)
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit
        continue-on-error: true

      - name: cargo audit (Rust dependencies)
        run: |
          cargo install cargo-audit --locked
          cargo audit
        continue-on-error: true
