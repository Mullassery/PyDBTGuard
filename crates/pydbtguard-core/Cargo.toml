[package]
name = "pydbtguard-core"
description = "Analysis engine for PyDBTGuard: reads real dbt artifacts (manifest, catalog, run_results, sources) and produces real reports, with no warehouse connection."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
serde_json = "1"
