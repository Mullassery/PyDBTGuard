[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "pydbtguard"
version = "2.4.0"
description = "Pre-deployment validation for dbt tests, entirely from local dbt artifacts."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Georgi Mullassery", email = "mullassery@gmail.com" }]
keywords = ["dbt", "data-quality", "testing", "lineage", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["click>=8.1"]

[project.optional-dependencies]
lineage = ["sqlglot>=25.0"]
duckdb = ["duckdb>=1.0"]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=7.0", "maturin>=1.5,<2.0", "duckdb>=1.0"]

[project.scripts]
pydbtguard = "pydbtguard.cli:main"

[project.entry-points."pydbtguard.warehouse_connectors"]
sqlite = "pydbtguard.connectors:SQLiteConnector"
duckdb = "pydbtguard.connectors:DuckDBConnector"
postgres = "pydbtguard.connectors:PostgresConnector"

[project.urls]
Homepage = "https://github.com/Mullassery/PyDBTGuard"
Repository = "https://github.com/Mullassery/PyDBTGuard"
Issues = "https://github.com/Mullassery/PyDBTGuard/issues"

[tool.maturin]
module-name = "pydbtguard._core"
manifest-path = "bindings/python/Cargo.toml"
include = ["LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
