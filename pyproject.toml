[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "pydbtguard"
version = "0.1.0"
description = "Pre-deployment validation & reliability testing for dbt"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Georgi Mammen Mullassery", email = "mullassery@gmail.com" }]
repository = "https://github.com/Mullassery/PyDBTGuard"

dependencies = [
    "click>=8.1.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "sqlglot>=24.0.0",
    "networkx>=3.0",
    "snowflake-connector-python>=3.0.0",
    "google-cloud-bigquery>=3.0.0",
    "pandas>=2.0.0",
    "pyarrow>=15.0.0",
    "tqdm>=4.0.0",
    "tomli>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
    "black>=23.0.0",
    "isort>=5.0.0",
    "mypy>=1.0.0",
]

[project.scripts]
pydbtguard = "pydbtguard.cli:main"

[tool.maturin]
module-name = "pydbtguard._core"
features = ["pyo3/extension-module"]
include = ["LICENSE"]
